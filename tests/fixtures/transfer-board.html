<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Synthetic transfer board</title>
  <style>
    :root {
      font-size: 13px;
      font-family: Arial, sans-serif;
      color: #252a28;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f2f3f2;
    }
    main {
      display: flex;
      min-height: 100vh;
    }
    nav {
      width: 220px;
      flex: none;
      padding: 18px;
    }
    article {
      background: #fff;
      margin: 8px;
      border-radius: 12px;
      flex: 1;
      padding: 1.25rem;
    }
    h1 {
      font-size: 1.6rem;
    }
    h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    button {
      padding: 0.5rem 0.9rem;
      background: white;
      border: 1px solid #e2e5e3;
      border-radius: 6px;
      box-shadow: 0 1px 3px #00000018;
    }
    section {
      border: 1px solid #e6e8e6;
      border-radius: 10px;
      margin: 1rem 0;
      box-shadow: 0 2px 6px #0000000a;
    }
    header {
      background: #f9faf9;
      padding: 1rem;
      border-bottom: 1px solid #ebedeb;
    }
    .content {
      padding: 1rem;
    }
    strong {
      font-size: 1.7rem;
      font-weight: 500;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    td {
      height: 3rem;
      padding: 0.6rem;
      border-bottom: 1px solid #eee;
    }
    svg {
      width: 100%;
      height: 140px;
    }
    .muted {
      color: #7b827e;
      font-size: 0.9rem;
    }
    @media (min-width: 1800px) {
      html.drift {
        font-size: 0.89vw;
      }
    }
  </style>
  <main>
    <nav data-designome-region="navigation">
      <h2>Fieldwork</h2>
      <p>Water sampling</p>
      <p>Station reports</p>
    </nav>
    <article data-designome-region="board">
      <h1>Watershed observations</h1>
      <button type="button" onclick="this.textContent = 'Period changed'">
        Change period
      </button>
      <section>
        <header><h2>Samples processed</h2></header>
        <div class="content">
          <strong>6,314</strong>
          <p class="muted">+8.2% versus earlier period</p>
        </div>
      </section>
      <section>
        <header><h2>Sampling activity</h2></header>
        <div class="content">
          <svg
            data-chart-ready="false"
            viewBox="0 0 600 140"
            role="img"
            aria-label="Synthetic sampling trend"
          >
            <path
              d="M0 110 L70 70 L140 90 L210 30 L280 45 L350 95 L420 55 L490 70 L600 15"
              stroke="#069d78"
              fill="none"
              stroke-width="1.5"
            />
          </svg>
        </div>
      </section>
      <table>
        <tr>
          <td>Station Cedar</td>
          <td>41 samples</td>
        </tr>
        <tr>
          <td>Station Willow</td>
          <td>67 samples</td>
        </tr>
      </table>
    </article>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    document.documentElement.classList.toggle('drift', query.has('drift'));
    if (query.has('long'))
      document.querySelector('td').textContent =
        'Station Cedar: extended catchment survey with a deliberately long technical label';
    window.releaseChart = () =>
      (document.querySelector('svg').dataset.chartReady = 'true');
    if (!query.has('unready')) releaseChart();
  </script>
</html>
